<VirtualHost *:80>
    ServerName 111.229.87.94
    DocumentRoot /var/www/ip-root
    DirectoryIndex index.html

    ProxyPreserveHost On

    # HealthDoc API and uploaded media under the IP-only application prefix.
    ProxyPass /healthdoc/api http://127.0.0.1:5050/api connectiontimeout=5 timeout=180
    ProxyPassReverse /healthdoc/api http://127.0.0.1:5050/api
    ProxyPass /healthdoc/uploads http://127.0.0.1:5050/uploads connectiontimeout=5 timeout=180
    ProxyPassReverse /healthdoc/uploads http://127.0.0.1:5050/uploads

    # CS2 keeps its existing loopback service and is exposed only below its prefix.
    ProxyPass /cs2_inventory/ http://127.0.0.1:5060/ connectiontimeout=5 timeout=240
    ProxyPassReverse /cs2_inventory/ http://127.0.0.1:5060/

    Alias /healthdoc/ /var/www/healthdoc-ip/

    <Directory /var/www/ip-root>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/healthdoc-ip>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /healthdoc/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /healthdoc/index.html [L]
    </Directory>

    RedirectMatch 302 ^/healthdoc$ /healthdoc/
    RedirectMatch 302 ^/cs2_inventory$ /cs2_inventory/

    <Files "index.html">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </Files>
    <LocationMatch "^/healthdoc/assets/[^/]+\.[A-Za-z0-9]+$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    SetEnvIfNoCase Request_URI "^/healthdoc/api/(ai|agent)/.*stream" no-gzip=1
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/ip-paths-error.log
    CustomLog ${APACHE_LOG_DIR}/ip-paths-access.log combined
</VirtualHost>
