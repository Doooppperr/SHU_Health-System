<VirtualHost *:80>
    ServerName healthdoc.cn
    ServerAlias www.healthdoc.cn 111.229.87.94
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5050/api connectiontimeout=5 timeout=180
    ProxyPassReverse /api http://127.0.0.1:5050/api
    ProxyPass /uploads http://127.0.0.1:5050/uploads connectiontimeout=5 timeout=180
    ProxyPassReverse /uploads http://127.0.0.1:5050/uploads
    ProxyPass /.well-known http://127.0.0.1:5050/.well-known connectiontimeout=5 timeout=30
    ProxyPassReverse /.well-known http://127.0.0.1:5050/.well-known
    ProxyPass /oauth/authorize http://127.0.0.1:5050/oauth/authorize connectiontimeout=5 timeout=30
    ProxyPassReverse /oauth/authorize http://127.0.0.1:5050/oauth/authorize
    ProxyPass /oauth/token http://127.0.0.1:5050/oauth/token connectiontimeout=5 timeout=30
    ProxyPassReverse /oauth/token http://127.0.0.1:5050/oauth/token
    ProxyPass /oauth/revoke http://127.0.0.1:5050/oauth/revoke connectiontimeout=5 timeout=30
    ProxyPassReverse /oauth/revoke http://127.0.0.1:5050/oauth/revoke
    ProxyPass /oauth/register http://127.0.0.1:5050/oauth/register connectiontimeout=5 timeout=30
    ProxyPassReverse /oauth/register http://127.0.0.1:5050/oauth/register
    ProxyPass /mcp http://127.0.0.1:5051/mcp connectiontimeout=5 timeout=180
    ProxyPassReverse /mcp http://127.0.0.1:5051/mcp

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # The SPA shell must be revalidated on every visit so a browser cannot keep
    # running routes from a previous release. Fingerprinted Vite assets are safe
    # to cache for a year because their URL changes whenever their content does.
    <Files "index.html">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </Files>
    <Files "release.json">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </Files>
    <LocationMatch "^/assets/[^/]+\.[A-Za-z0-9]+$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    SetEnvIfNoCase Request_URI "^/(api/(ai|agent)/.*stream|mcp)" no-gzip=1
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/healthdoc-error.log
    CustomLog ${APACHE_LOG_DIR}/healthdoc-access.log combined
</VirtualHost>
